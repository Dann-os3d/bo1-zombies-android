name: apply-zips
on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-zips
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip and apply
        run: bash apply-zips.sh
